<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Delay Player — Sports Analysis</title>
    <meta name="description" content="Time-delayed video playback for sports coaching and analysis. Record, replay with delay, annotate, and export clips.">

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script src="/cdn-proxy/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="/cdn-proxy/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
    <script type="module" src="main.js"></script>
</head>
<body>

<div class="app-shell">

    <!-- ===== VIDEO AREA ===== -->
    <div class="video-area">
        <video id="delayed" playsinline></video>
        <canvas id="annotation-canvas"></canvas>
        <div id="recording-indicator" class="rec-badge hidden">REC</div>
    </div>

    <!-- ===== BOTTOM PANEL ===== -->
    <div class="bottom-panel">

        <!-- Timeline -->
        <div id="timeline-wrapper" class="timeline-bar">
            <div id="timeline-spacer">
                <div id="thumbnails-container"></div>
                <div id="timeline-range-highlight">
                    <div class="resize-handle left"></div>
                    <div class="resize-handle right"></div>
                </div>
                <div id="timeline-indicator"></div>
            </div>
        </div>

        <!-- Primary Toolbar: Playback controls -->
        <div class="toolbar" id="primary-toolbar">
            <!-- Playback group -->
            <button id="frame-backward" class="btn btn-neutral" title="Frame back">
                <i class="fas fa-step-backward"></i>
            </button>
            <button id="play-pause" class="btn btn-playback" title="Play / Pause">
                <i class="fas fa-play"></i>
            </button>
            <button id="frame-forward" class="btn btn-neutral" title="Frame forward">
                <i class="fas fa-step-forward"></i>
            </button>

            <button id="slow-motion" class="btn btn-slowmo" title="Slow motion">
                <i class="fas fa-gauge-simple-high"></i>
                <span class="btn-label">Slow-Mo</span>
            </button>
            <button id="toggle-loop" class="btn btn-loop" title="Toggle loop">
                <i class="fas fa-repeat"></i>
                <span class="btn-label">Loop</span>
            </button>

            <div class="toolbar-divider"></div>

            <!-- Delay control -->
            <div class="delay-control">
                <label>Delay</label>
                <input type="range" id="delay-slider" min="3" max="60" value="5">
                <span class="delay-value" id="delay-value">5s</span>
            </div>

            <div class="toolbar-divider"></div>

            <!-- Session group -->
            <button id="toggle" class="btn btn-record" title="Start / Stop recording">
                <i class="fas fa-circle"></i>
                <span class="btn-label">Record</span>
            </button>
            <button id="sessions" class="btn btn-session" title="Sessions">
                <i class="fas fa-folder-open"></i>
                <span class="btn-label">Sessions</span>
            </button>
            <button id="export-clip" class="btn btn-export" title="Export MP4">
                <i class="fas fa-file-export"></i>
                <span class="btn-label">Export</span>
            </button>

            <!-- Overflow menu -->
            <div class="overflow-menu-wrapper">
                <button id="overflow-btn" class="btn btn-neutral" title="More">
                    <i class="fas fa-ellipsis-vertical"></i>
                </button>
                <div id="overflow-dropdown" class="overflow-dropdown">
                    <button id="import-session" class="btn btn-neutral">
                        <i class="fas fa-file-import"></i>
                        <span class="btn-label">Import Session</span>
                    </button>
                    <button id="clear" class="btn btn-danger">
                        <i class="fas fa-trash-alt"></i>
                        <span class="btn-label">Clear All Data</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Annotation Toolbar (auto-shows when paused) -->
        <div id="annotation-bar" class="annotation-bar">
            <label>Color</label>
            <input type="color" id="line-color" value="#ff0000">
            <label>Width</label>
            <input type="range" id="line-width" min="1" max="10" value="2">
            <button id="undo-annotation" class="btn btn-neutral" title="Undo">
                <i class="fas fa-undo"></i>
            </button>
            <button id="redo-annotation" class="btn btn-neutral" title="Redo">
                <i class="fas fa-redo"></i>
            </button>
        </div>
    </div>
</div>

<!-- ===== MODALS ===== -->

<!-- Sessions Modal -->
<div id="sessions-modal" class="modal-backdrop">
    <div class="modal-card">
        <h2><i class="fas fa-folder-open"></i> Sessions</h2>
        <ul id="sessions-list" class="sessions-list"></ul>
        <div class="modal-actions">
            <button id="close-sessions" class="btn btn-neutral">
                <i class="fas fa-times"></i>
                <span class="btn-label">Close</span>
            </button>
        </div>
    </div>
</div>

<!-- Session Name Modal -->
<div id="session-name-modal" class="modal-backdrop">
    <div class="modal-card">
        <h2>New Session</h2>
        <input id="session-name-input" type="text" placeholder="Session name...">
        <div class="modal-actions">
            <button id="session-name-cancel" class="btn btn-neutral">Cancel</button>
            <button id="session-name-confirm" class="btn btn-record">Start Recording</button>
        </div>
    </div>
</div>

<!-- Hidden elements -->
<input type="file" id="import-file-input" class="hidden" accept=".json">
<!-- Chrome bug: display:none prevents canvas drawImage. Hide visually instead. -->
<video id="video" style="opacity: 0; position: absolute; width: 1px; height: 1px; pointer-events: none;" autoplay muted playsinline></video>

</body>
</html>
